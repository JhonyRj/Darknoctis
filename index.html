.langflag{position:fixed;right:12px;bottom:12px;z-index:50;width:auto;min-width:0;padding:3px;border-radius:5px;line-height:0;background:rgba(0,0,0,.45);border:1px solid rgba(224,187,94,.5);cursor:pointer}.langflag svg{display:block;border-radius:2px}
#dayfx{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,rgba(30,22,12,.92),rgba(0,0,0,.97));animation:dfxIn .7s ease both;color:#e8d8a8;text-align:center;cursor:pointer}
#dayfx.vp{background:radial-gradient(circle at 50% 45%,rgba(60,8,16,.94),rgba(0,0,0,.97));color:#f0b8c0}
#dayfx.out{animation:dfxOut .7s ease both}
@keyframes dfxIn{from{opacity:0}to{opacity:1}}@keyframes dfxOut{from{opacity:1}to{opacity:0}}
.dfx-in{padding:20px}.dfx-t{font-size:15px;letter-spacing:4px;text-transform:uppercase;opacity:.8;margin-bottom:18px;animation:dfxUp .8s ease both}
.dfx-clock{position:relative;width:96px;height:96px;margin:0 auto 14px;border:4px solid currentColor;border-radius:50%;box-shadow:0 0 28px currentColor,inset 0 0 18px rgba(255,255,255,.08)}
.dfx-clock b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;opacity:.28}
.dfx-clock i{position:absolute;left:50%;bottom:50%;width:3px;background:currentColor;border-radius:2px;transform-origin:50% 100%;margin-left:-1.5px}
.dfx-h1{height:34px;animation:dfxSpin .6s linear infinite reverse}.dfx-h2{height:22px;animation:dfxSpin 3.6s linear infinite reverse}
#dayfx.vp .dfx-h1{animation-direction:normal}#dayfx.vp .dfx-h2{animation-direction:normal}
@keyframes dfxSpin{to{transform:rotate(360deg)}}
.dfx-n{font-size:54px;font-weight:700;line-height:1.1;text-shadow:0 0 18px currentColor}.dfx-n.tick{animation:dfxTick .12s ease}.dfx-n.fin{animation:dfxFin .9s ease both}
@keyframes dfxTick{from{transform:scale(1.12)}to{transform:scale(1)}}@keyframes dfxFin{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.dfx-s{margin-top:14px;font-size:14px;opacity:.85;max-width:300px;animation:dfxUp 1s .3s ease both}
@keyframes dfxUp{from{opacity:0;transform:translateY(8px)}to{opacity:.85;transform:none}}
</style>
<style>
/* Layout: the game is one pixel-art stage; HUD, actions and cards live inside it. The map opens as its own full-screen view. */
:root{
  --bg:#120f0b; --panel:#221c15; --panel2:#2d261c; --line:#4a3d2c;
  --ink:#eadfc7; --dim:#a69a7e; --ember:#e08a38; --blood:#b9483e; --mana:#4a8cff; --moss:#86a862; --frost:#86a9b8; --gold:#e0bb5e;
  --display:'Comic Neue','Comic Sans MS',cursive; --body:'Comic Neue','Comic Sans MS',cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--body);
  padding-block:10px 24px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.app{max-width:1100px;margin:0 auto;display:grid;gap:8px}
header.top{display:flex;align-items:baseline;justify-content:space-between}
h1{font:700 28px/1 var(--display);margin:0;color:var(--gold);letter-spacing:.5px}
h2{font:700 25px/1.1 var(--display);margin:0 0 6px;color:var(--gold);text-wrap:balance}
h3{font:700 19px/1.1 var(--display);margin:0 0 8px;color:var(--gold);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h4{margin:0 0 4px;font:700 16px var(--body)}
small{color:var(--dim);font:500 14px var(--body)}
p{margin:0 0 10px}.dim{color:var(--dim)}
.stagewrap{position:relative;width:100%;background:#000;border:2px solid #000;outline:1px solid var(--line);overflow:hidden}
img,canvas,.sprite{image-rendering:pixelated;image-rendering:crisp-edges;filter:none}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;background:#000}
#cv{width:100%;height:auto;aspect-ratio:16/9}
#ov{position:absolute;inset:0;pointer-events:none}
.hs{position:absolute;pointer-events:auto;background:transparent;border:2px dashed transparent;padding:0;min-height:0;cursor:pointer;color:#fff}
.hs span{position:absolute;left:50%;bottom:100%;transform:translate(-50%,2px);white-space:nowrap;background:rgba(20,15,10,.88);border:1px solid var(--gold);color:var(--gold);padding:1px 7px;font:700 13px var(--body);pointer-events:none}
.hs:hover,.hs:focus-visible{border-color:var(--gold);background:rgba(224,187,94,.12);outline:none}
#hudo{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 10px;pointer-events:none;background:linear-gradient(rgba(8,6,4,.6),rgba(8,6,4,0))}
#hudo>*{pointer-events:auto}
.hbars{display:grid;gap:3px}
.bar{display:grid;grid-template-columns:22px 92px auto;align-items:center;gap:3px;font-size:12px}
.bar b{color:#d8caa8;font-weight:700}
.bar em{font-style:normal;font-variant-numeric:tabular-nums;color:#d8caa8}
.tr{height:8px;background:#0e0b08;border:1px solid #5a4a36}
.tr i{display:block;height:100%}
.hmeta{font-size:12px;color:#eadfc7;margin-top:4px;text-shadow:0 1px 0 #000}
.chip{display:inline-block;padding:0 6px;border:1px solid var(--blood);color:#f0b3ac;background:rgba(30,10,8,.8);font-size:12px;font-weight:700;margin-left:4px}

    const w=1;
    G.hour++;if(G.mana==null)G.mana=MM();else if(G.mana<MM())G.mana++;if(G.hour===18&&G.day%2===0)lg('A lua cheia nasce no céu.');if(G.wolf&&!FM()){wolfHp(false);G.wolf=false;fx.morphRev=nowMs();lg('O dia clareia e você volta à forma humana.')}

function speck(x,y,w,h,col,n,seed){n=Math.ceil(n*.4);for(let i=0;i<n;i++)rc(x+h01(seed*977+i*3)*w,y+h01(seed*313+i*7+1)*h,.5,.5,col)}

  rc(x,y,w,h,base);const dk=shade(base,-26),lt=shade(base,16);
  for(let r=0;r*3<h;r++){rc(x,y+r*3,w,.5,dk);const off=(r%2)*2.5;for(let k=off;k<w;k+=5)rc(x+k,y+r*3,.5,Math.min(3,h-r*3),dk)}
  speck(x,y,w,h,lt,Math.floor(w*h/5),seed,1);speck(x,y,w,h,dk,Math.floor(w*h/7),seed+5,1);
  rc(x,y,w,.5,lt);rc(x,y+h-1,w,1,shade(base,-32));rc(x+w-1,y,1,h,shade(base,-18));rc(x,y,.5,h,lt);
}
function planks(x,y,w,h,base,seed){
  rc(x,y,w,h,base);const d=shade(base,-24),l=shade(base,14);

  speck(x,y,w,h,d,Math.floor(w*h/9),seed,1);
  for(let k=1;k<w-1;k+=6){rc(x+k,y+1,.5,.5,'#2a1c10');rc(x+k,y+h-2,.5,.5,'#2a1c10')}

}
function shingles(cx,topY,w,rh,col){
  for(let r=0;r<rh;r++){const ww=4+(w+6)*r/rh,x0=cx-ww/2;rc(x0,topY+r,ww,1,col);
    if(r%2===0){for(let k=0;k<ww;k+=2)rc(x0+k,topY+r+.5,1.5,.5,shade(col,-28))}else{for(let k=1;k<ww;k+=2)rc(x0+k,topY+r,.5,.5,shade(col,18))}
    rc(x0,topY+r,.5,1,shade(col,20));rc(x0+ww-.5,topY+r,.5,1,shade(col,-36))}

    for(let i=0;i<1700;i++){const x=h01(i*11)*W,y=top+1.5+h01(i*13+4)*(bot-top-2.5);rc(x,y,.5,.5,[shade(B.road,-18),shade(B.road,16),shade(B.road,-8),shade(B.road,26)][i%4])}
    for(const [yy,ph] of [[top+5,0],[top+11.5,2]]){for(let x=0;x<W;x+=.5){const y=yy+Math.sin(x/W*TWO*6+ph)*.8;rc(x,y,.5,.5,shade(B.road,-34));if(Math.floor(x)%7===0)rc(x,y+.5,1,.5,shade(B.road,12))}}

function morphHero(x,y,t,flip,p,pose,swing,k){
  const rnd=(i)=>{const v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v)};
  const sc=(a)=>{c.save();c.translate(x,y);c.scale(a,a);c.translate(-x,-y)};
  const hum=(jx,a)=>{sc(a);const keep=G.wolf;G.wolf=false;const eq={arm:G.arm,helm:G.helm,cape:G.cape,shield:G.shield,pants:G.pants,boots:G.boots};
    person(x+jx,y,{k:k||.72,hero:true,pose:'stand',t,flip,swing:0,g:G&&G.gender,eq:{},wep:null});G.wolf=keep;c.restore()};
  if(p<.52){
    const q=p/.52,jx=Math.round(Math.sin(p*90)*q*2.4);

    const n=Math.floor(q*16);for(let i=0;i<n;i++){const rx=x-8+Math.round(rnd(i)*16)+jx,ry=y-34+Math.round(rnd(i+9)*30),l=2+Math.round(rnd(i+3)*4);rc(rx,ry,1,l,'#8a0e12');rc(rx+(i%2?1:-1),ry+l-1,1,2,'#ff3a2a')}
    // pele rasgando: tufos de pelo furando e sangue escorrendo
    {const nf=Math.floor(q*11);for(let i=0;i<nf;i++){const fx0=x-9+Math.round(rnd(i+40)*18)+jx,fy0=y-36+Math.round(rnd(i+41)*32);rc(fx0,fy0,2,1,'#4a3830');rc(fx0+(i%2?1:-1),fy0-1,1,1,'#7a6454')}
     const nb=Math.floor(q*14);for(let i=0;i<nb;i++){const bx=x-8+Math.round(rnd(i+60)*16)+jx,by0=y-34+Math.round(rnd(i+61)*24),dl=2+Math.round(q*rnd(i+62)*9);rc(bx,by0,1,dl,'#8a0e14');rc(bx,by0+dl,1,1,'#c0222a')}
     if(q>.45){const ns=Math.floor((q-.45)*16);for(let i=0;i<ns;i++){const u=(q-.45)*1.6+rnd(i+70)*.2,dr=rnd(i+71)<.5?-1:1;rc(Math.round(x+dr*(5+u*20*rnd(i+72))),Math.round(y-28-rnd(i+73)*12+u*u*30),2,2,i%3?'#8a0e14':'#d02a2a')}}}
    // pedaços de roupa voando
    if(q>.3){const m=Math.floor((q-.3)*14);for(let i=0;i<m;i++){const u=(q-.3)*1.4+rnd(i)*.2,dir=rnd(i+5)<.5?-1:1;rc(Math.round(x+dir*(6+u*22*rnd(i+1))),Math.round(y-26+rnd(i+2)*18+u*u*26),2,2,i%3?'#5a4630':'#8a2a30')}}
  }else{
    const q=(p-.52)/.48;
    const a=1.25-Math.min(1,q*1.6)*.25,jx=Math.round(Math.sin(p*90)*(1-q)*2);
    sc(a);drawWW(x+jx,y,t,flip,{pose,swing},true);c.restore();
    {const nb=Math.floor((1-q)*14);for(let i=0;i<nb;i++){const u=q*1.3+rnd(i+80)*.3,dr=rnd(i+81)<.5?-1:1;rc(Math.round(x+dr*(6+u*28*rnd(i+82))),Math.round(y-34-rnd(i+83)*10+u*u*40),2,2,i%2?'#8a0e14':'#c0222a')}}
    // tufos de pelo e retalhos caindo
    const m=Math.floor((1-q)*16);for(let i=0;i<m;i++){const u=q*1.2+rnd(i)*.3,dir=rnd(i+5)<.5?-1:1;rc(Math.round(x+dir*(8+u*26*rnd(i+1))),Math.round(y-30+rnd(i+2)*20+u*u*34),i%2?3:2,2,i%3==0?'#8a2a30':i%3==1?'#5c3a28':'#34201a')}
  }
}

/* ================= RIG: personagens montados com formas e pintados em pixel art =================
   Cada personagem é desenhado em uma grade de células (1 célula = 1 unidade lógica = 2 pixels de tela),
   com luz no canto superior esquerdo, sombra no lado oposto e contorno escuro. O resultado vai para cache. */
const INK=[14,9,18];
const RIGC=new Map();
const _rgb=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
const _mixc=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const _hex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');
const LIGHTC=[255,244,216],SHADC=[30,16,44];
function tone(col,o){
  const b=typeof col==='string'?_rgb(col):col;o=o||{};
  return{b,h:_mixc(b,o.hc||LIGHTC,o.hi==null?.34:o.hi),s:_mixc(b,o.sc||SHADC,o.sh==null?.42:o.sh),m:_mixc(b,o.sc||SHADC,(o.sh==null?.42:o.sh)*.48),d:_mixc(b,SHADC,.62),x:_mixc(b,LIGHTC,.6)}
}
function Painter(K,w,h,ox,oy){
  const B={w,h,d:new Uint8Array(w*h*4)};
  const X=x=>ox+x*K,Y=y=>oy+y*K;
  const put=(x,y,c)=>{if(x<0||y<0||x>=w||y>=h)return;const i=(y*w+x)*4;B.d[i]=c[0];B.d[i+1]=c[1];B.d[i+2]=c[2];B.d[i+3]=255};
  const has=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&B.d[(y*w+x)*4+3]>0;
  // rasteriza uma união de formas em uma máscara
  function mask(parts){
    const m=new Uint8Array(w*h);let x0=w,y0=h,x1=0,y1=0;
    for(const s of parts){
      const t=s[0];let bx0,by0,bx1,by1,f;
      if(t==='e'){const cx=X(s[1]),cy=Y(s[2]),rx=Math.max(.6,s[3]*K),ry=Math.max(.6,s[4]*K);bx0=cx-rx;bx1=cx+rx;by0=cy-ry;by1=cy+ry;f=(px,py)=>{const a=(px-cx)/rx,b=(py-cy)/ry;return a*a+b*b<=1}}
      else if(t==='r'){bx0=X(s[1]);by0=Y(s[2]);bx1=bx0+s[3]*K;by1=by0+s[4]*K;f=(px,py)=>true}
      else if(t==='c'){const ax=X(s[1]),ay=Y(s[2]),r0=Math.max(.5,s[3]*K),bx=X(s[4]),by=Y(s[5]),r1=Math.max(.5,s[6]*K);const R=Math.max(r0,r1);bx0=Math.min(ax,bx)-R;bx1=Math.max(ax,bx)+R;by0=Math.min(ay,by)-R;by1=Math.max(ay,by)+R;
        const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy||1;f=(px,py)=>{let u=((px-ax)*dx+(py-ay)*dy)/L2;u=u<0?0:u>1?1:u;const qx=ax+dx*u,qy=ay+dy*u,r=r0+(r1-r0)*u;return(px-qx)*(px-qx)+(py-qy)*(py-qy)<=r*r}}
      else if(t==='p'){const pts=s[1].map((v,i)=>i%2?Y(v):X(v));bx0=1e9;by0=1e9;bx1=-1e9;by1=-1e9;for(let i=0;i<pts.length;i+=2){bx0=Math.min(bx0,pts[i]);bx1=Math.max(bx1,pts[i]);by0=Math.min(by0,pts[i+1]);by1=Math.max(by1,pts[i+1])}
        const n=pts.length/2;f=(px,py)=>{let ins=false;for(let i=0,j=n-1;i<n;j=i++){const xi=pts[i*2],yi=pts[i*2+1],xj=pts[j*2],yj=pts[j*2+1];if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)ins=!ins}return ins}}
      else continue;
      const ia=Math.max(0,Math.floor(bx0)),ib=Math.min(w-1,Math.ceil(bx1)),ja=Math.max(0,Math.floor(by0)),jb=Math.min(h-1,Math.ceil(by1));
      for(let j=ja;j<=jb;j++)for(let i=ia;i<=ib;i++){if(f(i+.5,j+.5)){m[j*w+i]=1;if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}}
    }
    m.bb=[x0,y0,x1,y1];return m;
  }
  // pinta a máscara com luz, sombra e textura
  function paint(parts,col,o){
    o=o||{};const m=parts.bb?parts:mask(parts),T=tone(col,o),[x0,y0,x1,y1]=m.bb;
    for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++){
      const k=j*w+i;if(!m[k])continue;
      const L=i>0&&m[k-1],U=j>0&&m[k-w],R=i<w-1&&m[k+1],D=j<h-1&&m[k+w];
      let c=T.b;
      if(o.side&&i>x1-(x1-x0)*o.side)c=T.m;
      if(o.bot&&j>y1-(y1-y0)*o.bot)c=T.m;
      if(o.top&&j<y0+(y1-y0)*o.top)c=T.h;
      if(!R||!D){if(!o.nosh)c=T.s}else if(!L||!U){if(!o.nohi)c=T.h}
      if(o.fn){const r=o.fn(i,j,T);if(r){c=typeof r==='string'?T[r]:r}}
      if(o.edge&&(!L||!U||!R||!D))c=o.edgec||INK;
      put(i,j,c);
    }
    return m;
  }
  const dot=(x,y,col,ww,hh)=>{const c=typeof col==='string'?_rgb(col):col;const a=Math.round(X(x)),b=Math.round(Y(y)),cw=Math.max(1,Math.round((ww||1)*K)),ch=Math.max(1,Math.round((hh||1)*K));for(let j=0;j<ch;j++)for(let i=0;i<cw;i++)put(a+i,b+j,c)};
  const shape=(parts,col,o)=>paint(parts,col,o);
  function finish(){ // contorno externo
    const d=B.d,out=new Uint8Array(d.length);out.set(d);
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){
      if(d[(j*w+i)*4+3])continue;
      if(has(i-1,j)||has(i+1,j)||has(i,j-1)||has(i,j+1)){const k=(j*w+i)*4;out[k]=INK[0];out[k+1]=INK[1];out[k+2]=INK[2];out[k+3]=255}
    }
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d'),id=g.createImageData(w,h);id.data.set(out);g.putImageData(id,0,0);
    return cv;
  }
  return{B,X,Y,put,has,mask,paint,dot,shape,finish,K,w,h,ox,oy};
}
const RAD=Math.PI/180;
const fk=(hx,hy,th,len)=>[hx+Math.sin(th*RAD)*len,hy+Math.cos(th*RAD)*len];
const STL=()=>({b:'#9aa6b8',hc:[255,255,255],sc:[28,20,60]});

/* ----- cores da armadura por nível ----- */
const LC='#8a5a30',LC2='#7a4d28',LC3='#5e3a1c';const isL=q=>!!(q&&(q.L||/couro/i.test(q.n||'')));
const ARM_COL=t=>t===3?'#4a3a86':t===0?'#8a5a30':t===1?mix(P.mist,P.mtnSh,.32):mix(P.mist,P.white,.2);
/* ================= HUMANO ================= */
function buildHuman(o,K){
  const w=Math.ceil(110*K),h=Math.ceil(86*K),ox=Math.round(40*K),oy=Math.round(78*K);
  const Pn=Painter(K,w,h,ox,oy),{paint,dot,mask}=Pn;
  const pose=o.pose||'stand',t=o.t||0,fem=o.g==='f',eq=o.eq||{},sw=o.swing||0,vamp=o.style==='vamp';
  const walk=pose==='walk',sit=pose==='sit',atk=pose==='atk',thr=pose==='throw';
  const ph=walk?Math.floor(t*8)%4:0,br=(!walk&&!sit)?Math.floor(t*1.4)%2:0;
  // ---- cores ----
  const skin=o.skin||mix(P.gold,P.pinkL,.34),hair=o.hair||(fem?mix(P.wood,P.orL,.3):mix(P.wood,P.earth,.2)),
        shirt=o.cloth||(fem?mix(P.pinkR,P.earth,.35):mix(P.gold,P.white,.5)),pants=o.pants||mix(P.earth,P.gold,.18),boot=o.boot||mix(P.wood,P.earth,.35);
  const tierOf=q=>q?(q.tier!=null?q.tier:(q.def>=5?2:q.def>=3?1:0)):-1;
  const ta0=tierOf(eq.arm),tp=tierOf(eq.pants),tb=tierOf(eq.boots),th=eq.helm?(eq.helm.tier||0):-1;
  const hideA=ta0===4||!!o.hide,ta=ta0===4?-1:ta0,HG='#3f7a34',HG2='#356a2c';
  const hasA=ta>=0;

function campComps(obj){
  if(obj._cp)return obj._cp;
  const w=obj.width,h=obj.height,d=obj.getContext('2d').getImageData(0,0,w,h).data,gw=w>>1,gh=h>>1,m=new Uint8Array(gw*gh);
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){if(d[((y*2)*w+x*2)*4+3]>40)m[y*gw+x]=1}
  const m2=new Uint8Array(gw*gh);
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++)if(m[y*gw+x])for(let k=-3;k<=3;k++){const xx=x+k;if(xx>=0&&xx<gw)m2[y*gw+xx]=1}
  const lab=new Int32Array(gw*gh),out=[];let n=0;
  for(let i=0;i<gw*gh;i++){if(!m2[i]||lab[i])continue;n++;const st=[i];lab[i]=n;let maxY=0;
    while(st.length){const p=st.pop(),x=p%gw,y=(p/gw)|0;if(m[p]&&y>maxY)maxY=y;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=gw||yy>=gh)continue;const j=yy*gw+xx;if(m2[j]&&!lab[j]){lab[j]=n;st.push(j)}}}
    out.push({n,gy:maxY+1})}
  const res=[];
  for(const q of out){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d'),id=x.createImageData(w,h);let cnt=0;
    for(let y=0;y<gh;y++)for(let xx=0;xx<gw;xx++){if(m[y*gw+xx]&&lab[y*gw+xx]===q.n){cnt++;for(let a=0;a<2;a++)for(let b=0;b<2;b++){const k=(((y*2+a)*w)+xx*2+b)*4;id.data[k]=d[k];id.data[k+1]=d[k+1];id.data[k+2]=d[k+2];id.data[k+3]=d[k+3]}}}
    if(cnt<6)continue;x.putImageData(id,0,0);res.push({img:cv,gy:q.gy})}
  return obj._cp=res;
}

const bar=(l,v,m,col)=>`<div class="bar" title="${l}"><b>${l.split(" ")[0]}</b><div class="tr"><i style="width:${Math.max(0,Math.min(100,v/m*100))}%;background:var(${col})"></i></div><em>${Math.round(v)}/${m}</em></div>`;
const FXE={sangramento:'🩸',atordoamento:'💫',fogo:'🔥',veneno:'☠️',gelo:'❄️',trovao:'⚡'};
const gdesc=o=>o.k==='sc'?`<span style="color:#c9a0ff">${o.n}</span> <small>Encantamento ${FXE[o.fx]||''} · use na bigorna</small>`:o.k==='w'?`<span style="color:${RAR[o.ri].c}">${o.n}</span> <small>dano ${o.a+o.lvl-1}-${o.b+o.lvl-1}${o.fx?' · '+o.fx:''} · dur ${durP(o)}</small>`:`<span>${o.n}</span> <small>${SLOTN[o.k]||'Armadura'} · defesa ${o.def}${o.mg?` · +${o.mg} magia · +${o.sp}% dano mágico`:''} · dur ${durP(o)}</small>`;
const cost=cc=>Object.entries(cc).map(([k,n])=>`<span style="color:${have(k)>=n?'var(--moss)':'var(--blood)'}">${n} ${nm(k)}</span>`).join(', ');
const V={};
V.pack=()=>{
  const cb=G.view==='combat';
  let h=`<section class="card"><h3>Inventário <small>peso ${weight()}/${cap()} · ${fmtCoins(G.coins)}</small></h3>`;
  h+=`<div class="row"><span class="l"><small>Arma</small><br>${G.wep?gdesc(G.wep):'Punhos'}</span>${G.wep&&!cb?`<span class="r"><button class="sm" data-a="unequip" data-v="wep">Tirar</button></span>`:''}</div>${[['arm','Peitoral'],['helm','Elmo'],['cape','Capa'],['shield','Escudo'],['pants','Calça']].map(([s,l])=>`<div class="row"><span class="l"><small>${l}</small><br>${G[s]?gdesc(G[s]):'—'}</span>${G[s]&&!cb?`<span class="r"><button class="sm" data-a="unequip" data-v="${s}">Tirar</button></span>`:''}</div>`).join('')}`;
  for(const o of G.bag)h+=`<div class="row"><span class="l">${gdesc(o)}</span><span class="r">${o.dur>0?`<button class="sm" data-a="equip" data-v="${o.id}" ${cb?'disabled':''}>Equipar</button>`:'<small class="dim">Quebrado </small>'}<button class="sm" data-a="dropg" data-v="${o.id}">Largar</button></span></div>`;
  const ks=Object.keys(G.inv);
  if(!ks.length)h+=`<p class="dim" style="margin-top:8px">Nenhum item no inventário.</p>`;
  for(const k of ks){const it=IT[k],u=it.food||it.water||it.heal||it.mana||k==='holy';
    h+=`<div class="row"><span class="l">${it.i} ${it.n} <small>×${G.inv[k]}</small></span><span class="r">${u?`<button class="sm" data-a="use" data-v="${k}" ${cb?'disabled':''}>Usar</button>`:''}<button class="sm" data-a="drop" data-v="${k}">Largar</button></span></div>`}
  return h+`<div class="btns"><button data-a="close">Fechar</button></div></section>`;
};
V.chest=()=>{
  let h=`<section class="card"><h2>Depósito</h2><p class="dim">Guarde o que não precisa carregar. Não há limite de peso, mas a comida apodrece com o tempo.</p>`;
  const ks=Object.keys(G.chest.inv);
  h+=`<h3>No depósito</h3>`;
  if(!ks.length&&!G.chest.bag.length)h+='<p class="dim">Vazio.</p>';
  for(const k of ks)h+=`<div class="row"><span class="l">${IT[k].i} ${IT[k].n} <small>×${G.chest.inv[k]}</small></span><span class="r"><button class="sm" data-a="take" data-v="${k}:1">Pegar 1</button><button class="sm" data-a="take" data-v="${k}:all">Todos</button></span></div>`;
  for(const o of G.chest.bag)h+=`<div class="row"><span class="l">${gdesc(o)}</span><span class="r"><button class="sm" data-a="takeg" data-v="${o.id}">Pegar</button></span></div>`;
  h+=`<h3 style="margin-top:12px">No inventário <small>peso ${weight()}/${cap()}</small></h3>`;
  for(const k of Object.keys(G.inv))h+=`<div class="row"><span class="l">${IT[k].i} ${IT[k].n} <small>×${G.inv[k]}</small></span><span class="r"><button class="sm" data-a="store" data-v="${k}:1">Guardar 1</button><button class="sm" data-a="store" data-v="${k}:all">Todos</button></span></div>`;
  for(const o of G.bag)h+=`<div class="row"><span class="l">${gdesc(o)}</span><span class="r">${o.dur>0?`<button class="sm" data-a="storeg" data-v="${o.id}">Guardar</button>`:'<small class="dim">Quebrado</small>'}</span></div>`;
  return h+`<div class="btns"><button data-a="close">Fechar</button></div></section>`;
};
V.upgrade=()=>{
  let h=`<section class="card"><h2>Melhorias</h2><div class="tabs"><button class="${G.utab==='build'?'on':''}" data-a="utab" data-v="build">Construir</button><button class="${G.utab==='craft'?'on':''}" data-a="utab" data-v="craft">Fabricar</button></div>`;
  if(G.utab==='build'){
    h+=`<div class="grid2">`;
    for(const[k,b]of Object.entries(BUILD)){const ok=Object.entries(b.cost).every(([i,n])=>have(i)>=n);
      h+=`<div class="opt"><h4>${b.n} ${G.b[k]?'<small>(construído)</small>':''}</h4><p class="dim" style="margin:0 0 4px">${b.d}</p><p style="margin:0 0 6px;font-size:14px">${cost(b.cost)} · 2h</p>${G.b[k]?'':`<button class="sm ${ok?'pri':''}" data-a="built" data-v="${k}" ${ok?'':'disabled'}>Construir</button>`}</div>`}
    h+='</div>';
  }else{
    h+=`<p class="dim">Usa itens do inventário e do depósito. Itens de consumo vão para o depósito.</p><div class="grid2">`;
    for(const r of RECIPES){const ok=Object.entries(r.need).every(([k,n])=>have(k)>=n)&&(!r.forge||G.b.forge)&&(!r.repair||(G.wep&&G.wep.dur<G.wep.max));
      h+=`<div class="opt"><h4>${r.n}</h4><p class="dim" style="margin:0 0 6px">${cost(r.need)}${r.forge?' · exige Ferraria':''}${r.h?' · '+r.h+'h':''}</p><button class="sm ${ok?'pri':''}" data-a="make" data-v="${r.id}" ${ok?'':'disabled'}>Fazer</button></div>`}
    h+='</div>';
  }
  return h+`<div class="btns"><button data-a="close">Fechar</button></div></section>`;
};
V.trade=()=>{
  const T=G.trade;
  let h=`<section class="card trd"><h2>${T.name}</h2><div class="row"><span class="l"><small>Bolsa do mercador</small><br><b>${COIN_CU()} ???</b></span><span class="r"><small>Você</small><br><b>${fmtCoins(G.coins)}</b></span></div><p class="dim">Ele compra por 80% do valor, até o que tiver na bolsa.</p><h3>Comprar <small>${fmtCoins(G.coins)}</small></h3><div class="mscroll big tl" data-sc="tb">`;
  T.stock.forEach((s,i)=>{const label=s.gear?gdesc(s.gear):`${IT[s.key].i} ${IT[s.key].n}`;
    h+=`<div class="row"><span class="l">${label} <small>×${s.q}</small></span><span class="r"><button class="sm" data-a="buy" data-v="${i}" ${s.q<1||G.coins<s.p?'disabled':''}>${COIN_CU()} ${s.p}</button></span></div>`});
  h+=`</div><h3 style="margin-top:12px">Vender</h3><div class="mscroll big tl" data-sc="ts">`;
  const ks=Object.keys(G.inv).filter(k=>IT[k].sell>0);
  if(!ks.length&&!G.bag.length)h+='<p class="dim">Nada para vender.</p>';
  for(const k of ks)h+=`<div class="row"><span class="l">${IT[k].i} ${IT[k].n} <small>×${G.inv[k]}</small></span><span class="r"><button class="sm" data-a="sell" data-v="${k}">${COIN_CU()} ${Math.round(IT[k].sell*.8)||1}</button></span></div>`;
  for(const o of G.bag)h+=`<div class="row"><span class="l">${gdesc(o)}</span><span class="r"><button class="sm" data-a="sell" data-v="g:${o.id}">${COIN_CU()} ${Math.round(gv(o)*.6)}</button></span></div>`;
  return h+`</div><div class="btns"><button data-a="close">Fechar</button></div></section>`;
};

V.info=()=>{
  const nx=need(),xp=G.xp||0,pct=Math.min(100,Math.round(xp/nx*100)),S=G.scene&&G.scene.en?G.scene:null;
  const st=[];
  if(G.turned)st.push(`🧛 <b>${vFull()?'Vampiro':'Vampirismo'}</b> (${vFull()?'nível':'vampirismo'} ${VL()}/10${vFull()?'':vBite()?' · morde, mas ainda sem morcego':' · sem habilidades ainda: distribua pontos em Vampirismo'}) · ${isNight()?'forte (noite): +50% de dano, mais rápido':'fraco (dia): −30% de dano e +25% de dano recebido'}`);
  if(G.vamp)st.push('🧛 <b>Vampirismo</b> · infecção ativa. Água benta ou oração podem curar; se morrer assim, você se levanta como vampiro. Sono recupera só metade.');
  if(G.lyc){const L=G.lyc,tn=L.tn||0,pm=!!L.perm,cura=pm?'A água benta não cura mais.':'Transformações '+tn+'/3. Água benta ainda pode curar.';
    if(G.wolf)st.push('🐺 <b>Lobisomem</b> · transformado: +200% de dano, sofre bem menos dano, itens guardados no inventário. Uivo cura 12–15% da vida. '+cura);
    else if(pm)st.push(`🐺 <b>Lobisomem</b> · maldição permanente${FM()&&isNight()?' · lua cheia agora: você pode se transformar':' · transforma na lua cheia (noite, a cada 2 dias)'}. ${cura}`);
    else if(L.fev>0)st.push(`🤒 <b>Licantropia (febre)</b> · ${L.fev} noite(s) de febre. Depois dela, a maldição desperta. ${cura}`);
    else if(L.on)st.push(`🐺 <b>Licantropia</b> · maldição ativa${FM()&&isNight()?' · lua cheia agora: você pode se transformar':' · transforma na lua cheia (noite, a cada 2 dias)'}. ${cura}`)}
  if(G.food<=0||G.water<=0)st.push(`⚠️ <b>Sem ${G.food<=0&&G.water<=0?'comida e água':G.food<=0?'comida':'água'}</b> · perdendo vida a cada 2h`);
  if(S&&S.hs){const h=S.hs;if(h.bleed>0)st.push(`🩸 <b>Sangrando</b> · ${h.bleed} turno(s), −2 por turno`);if(h.stun>0)st.push(`💫 <b>Atordoado</b> · ${h.stun} turno(s)`);if(h.burn>0)st.push(`🔥 <b>Queimando</b> · ${h.burn} turno(s), −3 por turno`);if(h.poison>0)st.push(`☠️ <b>Envenenado</b> · ${h.poison} turno(s), −2 por turno`);if(h.frost>0)st.push(`❄️ <b>Congelado</b> · ${h.frost} turno(s), −30% de dano`)}
  if(G.bat)st.push('🦇 <b>Forma de morcego</b>');
  const w=G.wep&&G.wep.dur>0?G.wep:null,rg=!!(w&&/besta/i.test(w.n)),cj=!!(w&&/cajado/i.test(w.n)),fo=rg?AT('des'):cj?AT('int'):AT('for'),de=AT('des'),ag=AT('agi'),vi=AT('vit'),it=AT('int');
  const ps=[['Peitoral',G.arm],['Elmo',G.helm],['Capa',G.cape],['Escudo',G.shield],['Calça',G.pants],['Botas',G.boots]];
  const def=ps.reduce((s,[,p])=>s+(p&&p.dur>0?p.def:0),0);
  const mul=1+.04*fo,nm=G.turned?(isNight()?1.5:.7):1;
  const dmin=w?Math.round((w.a+w.lvl-1)*mul*nm):Math.round(1*mul*nm),dmax=w?Math.round((w.b+w.lvl-1)*mul*nm):Math.round(3*mul*nm);
  const row=(a,b)=>`<div class="row"><span class="l">${a}</span><span class="r">${b}</span></div>`;
  const bon=(n,l)=>n?`<span class="bn">+${n} ${l}</span>`:'';
  const tile=(ic,lab,val,subs)=>`<div class="stt"><small>${ic} ${lab}</small><b>${val}</b><div class="sbs">${subs.filter(Boolean).join('')||'<span class="bn z">sem bônus</span>'}</div></div>`;
  const wA=w?w.a+w.lvl-1:1,wB=w?w.b+w.lvl-1:3,lvB=lv()-1,hpBase=G.mhp-5*vi-lvB;
  const armD=ps.map(([n,p])=>p&&p.dur>0?p.def:0),eqList=ps.filter(([,p])=>p&&p.dur>0&&p.def>0).map(([n,p])=>`<span class="bn">${n} +${p.def}</span>`);
  return `<section class="card"><h2>Informações do personagem</h2>
  <div class="xpw">${row(`⭐ Nível <b>${lv()}</b> / 150`,`${xp} / ${nx} XP`)}<div class="xpb" style="width:100%;height:8px"><i style="width:${pct}%"></i></div>${(G.pts||0)>0?`<div class="ptsb">✨ <b>${G.pts}</b> ponto(s) de atributo para distribuir</div>`:''}</div>
  <div class="iscroll">
  ${st.length?`<h3>Status</h3>${st.map(s=>`<p style="margin:3px 0">${s}</p>`).join('')}`:''}
  <div class="stg">
  ${tile('❤️','Vida máxima',G.mhp,[`<span class="bn z">base ${hpBase}</span>`,bon(lvB,'nível'),bon(5*vi,'vitalidade')])}
  ${tile(cj?'🔮':'⚔️',cj?'Dano mágico (cajado)':'Dano corpo a corpo',`${dmin}-${dmax}`,[`<span class="bn z">${w?'arma':'punhos'} ${wA}-${wB}</span>`,bon(Math.round(4*fo),rg?'% destreza':cj?'% inteligência':'% força'),G.turned?(isNight()?'<span class="bn">+50% noite</span>':'<span class="bn bad">−30% dia</span>'):'',w&&w.fx?`<span class="bn">${w.fx==='trovao'?'trovão':w.fx}</span>`:''])}
  ${tile('🛡️','Defesa',`−${def}`,eqList.length?eqList:[])}
  ${tile('💨','Esquiva',`${Math.min(60,ag)}%`,[bon(ag,'% agilidade')])}
  ${tile('🎒','Carga máxima',cap(),[`<span class="bn z">base ${cap()-2*AT('for')}</span>`,bon(2*AT('for'),'força')])}
  ${tile('🏹','Distância',`+${de}%`,[bon(de*4,'% dano (destreza)')])}
  ${tile('🔮','Magia máxima',MM(),[`<span class="bn z">base 50</span>`,bon(4*it,'inteligência'),bon(MG(),'equipamento'),bon(SP(),'% dano mágico')])}
  </div>
  <h3>Equipamento</h3>
  <div class="eqg">${[['Arma',G.wep],...ps].filter(([,p])=>p).map(([n,p])=>`<div class="eqi"><small>${n}</small><span>${gIcon(p)} ${p.n}</span><div class="sbs">${n==='Arma'?`<span class="bn z">dano ${p.a+p.lvl-1}-${p.b+p.lvl-1}</span>${/cajado/i.test(p.n)?'<span class="bn">gasta 3 magia</span>':''}${p.lvl>1?`<span class="bn">nv ${p.lvl}</span>`:''}${p.fx?`<span class="bn el">${({sangramento:'🩸',atordoamento:'💫',fogo:'🔥',veneno:'☠️',gelo:'❄️',trovao:'⚡'})[p.fx]||''} ${p.fx==='trovao'?'trovão':p.fx}</span>`:''}`:`<span class="bn">defesa +${p.def}</span>${p.mg?`<span class="bn">+${p.mg} magia · +${p.sp}% mágico</span>`:''}`}<span class="bn z">${durP(p)}</span></div><div class="eqd"><i style="width:${Math.max(0,Math.min(100,p.dur/p.max*100))}%;background:${p.dur<=0?'#a33':p.dur/p.max<.35?'#c80':'#4a4'}"></i></div></div>`).join('')||'<p class="dim">Sem equipamento.</p>'}</div>
  </div>
  <div class="btns"><button data-a="close">Voltar</button></div></section>`;
};

new MutationObserver(()=>{document.querySelectorAll('#modal .mscroll[data-sc]').forEach(el=>{const v=SCR[el.dataset.sc];if(v&&Math.abs(el.scrollTop-v)>1)el.scrollTop=v})}).observe(document.getElementById('modal'),{childList:true,subtree:true});
V.chest=()=>{
  const sel=(id)=>CSEL===id?'sel':'';
  const cell=(id,ic,extra,title)=>`<button class="mslot ${sel(id)}" data-a="csel" data-v="${id}" title="${title}"><span class="mi">${ic}</span>${extra||''}</button>`;
  const mk=(pre,inv,bag,min)=>{const it=[];for(const o of bag)it.push(cell(pre+':g:'+o.id,gIcon(o),durBar(o),o.n));for(const k of Object.keys(inv))it.push(cell(pre+':i:'+k,IT[k].i,`<b class="mn">${inv[k]}</b>`,IT[k].n));const tot=Math.max(min,Math.ceil((it.length+9)/9)*9);while(it.length<tot)it.push('<div class="mslot empty"></div>');return it.join('')};
  let det='<p class="dim">Toque num item para ver as opções.</p>';
  if(CSEL){const[w,t,...r]=CSEL.split(':'),id=r.join(':');
    if(w==='c'&&t==='i'&&G.chest.inv[id]){const it=IT[id];det=`<div class="row"><span class="l">${it.i} ${it.n} <small>×${G.chest.inv[id]}</small></span><span class="r"><button class="sm" data-a="take" data-v="${id}:1">Pegar 1</button><button class="sm" data-a="take" data-v="${id}:all">Todos</button></span></div>`}
    else if(w==='c'&&t==='g'){const o=G.chest.bag.find(x=>x.id===id);if(o)det=`<div class="row"><span class="l">${gdesc(o)}</span><span class="r"><button class="sm" data-a="takeg" data-v="${o.id}">Pegar</button></span></div>`}
    else if(w==='p'&&t==='i'&&G.inv[id]){const it=IT[id];det=`<div class="row"><span class="l">${it.i} ${it.n} <small>×${G.inv[id]}</small></span><span class="r"><button class="sm" data-a="store" data-v="${id}:1">Guardar 1</button><button class="sm" data-a="store" data-v="${id}:all">Todos</button></span></div>`}
    else if(w==='p'&&t==='g'){const o=G.bag.find(x=>x.id===id);if(o)det=`<div class="row"><span class="l">${gdesc(o)}</span><span class="r">${o.k==='sc'||o.dur>0?`<button class="sm" data-a="storeg" data-v="${o.id}">Guardar</button>`:'<small class="dim">Quebrado</small>'}</span></div>`}
  }
  return `<section class="card mc mcw"><h2>Depósito</h2>${lvBox('chest')}<p class="dim">Guarde o que não precisa carregar. Capacidade ${chestW()}/${chestCap()}. A comida apodrece com o tempo.</p>
  <h3>No depósito</h3><div class="mgrid mscroll big" data-sc="c">${mk('c',G.chest.inv,G.chest.bag,90)}</div>
  <h3 style="margin-top:8px">No inventário <small>peso ${weight()}/${cap()}</small></h3><div class="mgrid mscroll" data-sc="p">${mk('p',G.inv,G.bag,27)}</div>
  <div class="mdet">${det}</div>
  <div class="btns"><button data-a="close">Voltar</button></div></section>`;
};

/* ===== Bigorna ===== */
let AIT=null,AMAT=false,ASCR=null,AARW=false,ATAB='repair';
const aItem=id=>{if(!id)return null;const[t,v]=[id[0],id.slice(2)];return t==='e'?(G[v]||null):t==='c'?((G.chest&&G.chest.bag)||[]).find(o=>o.id===v)||null:G.bag.find(o=>o.id===v)||null};
A.openanvil=()=>{AARW=false;AIT=null;AMAT=false;ASCR=null;ATAB='repair';G.modal='anvil'};
A.antab=v=>{if(SL('anvil')<({repair:1,ench:2,dis:3})[v])return;ATAB=v;AARW=false;AIT=null;AMAT=false;ASCR=null};
const dismRef=o=>{const nm=x=>String(x).replace(/ \(defesa \d+\)/,'').trim(),r=RECIPES.find(q=>q.gear&&nm(q.n)===nm(o.n)),out={};const mats=['iron','leather','cloth','wood'];if(r){for(const [k,n] of Object.entries(r.need))if(mats.includes(k)){const q=Math.floor(n*.5);if(q>0)out[k]=q}}if(!Object.keys(out).length)out[repMat(o)]=o.k==='w'?2:1;return out};
A.dismantle=()=>{const o=aItem(AIT);if(!o||o.k==='sc')return;const ref=dismRef(o);advance(1);if(G.dflag||G.view==='over')return;if(AIT[0]==='e')G[AIT.slice(2)]=null;else if(AIT[0]==='c'){const i=G.chest.bag.indexOf(o);if(i>=0)G.chest.bag.splice(i,1)}else{const i=G.bag.indexOf(o);if(i>=0)G.bag.splice(i,1)}const got=[];for(const [k,n] of Object.entries(ref)){gain(k,n);got.push(n+'x '+IT[k].n)}lg(`Você desmontou ${o.n}: ${got.join(', ')}.`);G.note='Desmontado: '+got.join(', ')+'.';AIT=null};
const repMat=o=>{const n=(o&&o.n||'').toLowerCase();return /couro|gambeson|capuz/.test(n)?'leather':/pano|viajante|lã|capa/.test(n)?'cloth':/madeira|cajado/.test(n)?'wood':'iron'};
A.asel=v=>{if(v==='i:arrow'){AARW=!AARW;if(AARW){AIT=null;AMAT=false}return}if(AARW&&(v[0]==='e'||v[0]==='i'||(v[0]==='g'&&(G.bag.find(x=>x.id===v.slice(2))||{}).k!=='sc')))AARW=false;if(v[0]==='g'){const sc=G.bag.find(x=>x.id===v.slice(2));if(sc&&sc.k==='sc'){ASCR=(ASCR===sc.id)?null:sc.id;AMAT=false;return}}if(v[0]==='i'){const k=v.slice(2);AMAT=(AMAT===k)?false:k;ASCR=null}else AIT=(AIT===v)?null:v};
A.enchant=()=>{if(AARW){const sc=G.bag.find(x=>x.id===ASCR&&x.k==='sc'),n=Math.min(10,G.inv.arrow||0);if(!sc||!n)return;advance(1);if(G.dflag||G.view==='over')return;G.inv.arrow-=n;if(!G.inv.arrow)delete G.inv.arrow;const k='arrow_'+sc.fx;G.inv[k]=(G.inv[k]||0)+n;G.bag.splice(G.bag.indexOf(sc),1);lg(`${n} flecha(s) encantadas com ${FXL[sc.fx]}: a ${sc.n} se desfaz em luz.`);ASCR=null;AARW=false;G.note='Flechas encantadas: '+FXL[sc.fx]+'.';return}const o=aItem(AIT),sc=G.bag.find(x=>x.id===ASCR&&x.k==='sc');if(!o||o.k!=='w'||!sc)return;advance(1);if(G.dflag||G.view==='over')return;const old=o.fx&&FXN[o.fx];if(old&&o.n.endsWith(old))o.n=o.n.slice(0,-old.length);o.fx=sc.fx;o.n+=FXN[sc.fx]||'';G.bag.splice(G.bag.indexOf(sc),1);lg(`${o.n}: a ${sc.n} se desfaz em luz e a arma é encantada.`);ASCR=null;AIT=null;G.note='Arma encantada: '+sc.fx+'.'};
A.repair=()=>{const o=aItem(AIT);if(!o||!AMAT||AMAT!==repMat(o)||o.dur>=o.max||have(AMAT)<2)return;spend(AMAT,2);advance(1);if(G.dflag||G.view==='over')return;o.dur=o.max;lg(`${o.n} foi consertada.`);AIT=null;AMAT=false};
V.anvil=()=>{
  const cell=(id,ic,extra,title,on)=>`<button class="mslot ${on?'sel':''}" data-a="asel" data-v="${id}" title="${title}"><span class="mi">${ic}</span>${extra||''}</button>`;
  const o=aItem(AIT),mk=o?repMat(o):'iron',fe=have(mk);const tab=ATAB;let scr=(tab==='ench'&&ASCR)?G.bag.find(x=>x.id===ASCR&&x.k==='sc'):null;if(ASCR&&!scr)ASCR=null;if(tab!=='ench'){ASCR=null;AARW=false}if(AARW&&!(G.inv.arrow>0))AARW=false;const enOk=!!(o&&o.k==='w'&&scr)||!!(AARW&&scr);
  const cells=[];
  for(const s of (tab==='dis'?[]:tab==='ench'?['wep']:['wep','helm','arm','pants','boots','cape','shield'])){const g=G[s];if(g&&AIT!=='e:'+s)cells.push(cell('e:'+s,gIcon(g),durBar(g),g.n,AIT==='e:'+s))}
  for(const g of G.bag)if(AIT!=='g:'+g.id&&ASCR!==g.id&&(tab==='ench'?(g.k==='w'||g.k==='sc'):g.k!=='sc'))cells.push(cell('g:'+g.id,gIcon(g),durBar(g),g.n,false));
  if(tab==='repair')for(const k of ['iron','leather','cloth','wood']){const left=have(k)-(AMAT===k?2:0);if(left>0)cells.push(AMAT===k?`<div class="mslot"><span class="mi">${IT[k].i}</span><b class="mn">${left}</b></div>`:cell('i:'+k,IT[k].i,`<b class="mn">${left}</b>`,IT[k].n,false))}
  if(tab==='ench'&&G.inv.arrow>0&&!AARW)cells.push(cell('i:arrow',IT.arrow.i,`<b class="mn">${G.inv.arrow}</b>`,'Flechas',false));
  while(cells.length<18||cells.length%9)cells.push('<div class="mslot empty"></div>');
  const need=o&&o.dur<o.max,ready=o&&AMAT===mk&&need&&fe>=2;
  const slot=(ic,txt,extra)=>`<div class="mslot big">${ic?`<span class="mi">${ic}</span>`:''}${extra||''}</div>`;
  const dref=(tab==='dis'&&o&&o.k!=='sc')?dismRef(o):null,dk=dref?Object.keys(dref)[0]:null;
  const res=dref?`<button class="mslot big" data-a="dismantle" title="Desmontar"><span class="mi">${IT[dk].i}</span><b class="mn">${Object.values(dref).reduce((a,b)=>a+b,0)}</b></button>`:enOk?`<button class="mslot big" data-a="enchant" title="Encantar"><span class="mi">${AARW?IT.arrow.i:gIcon(o)}</span><i class="mdur" style="width:100%;background:#a070d0"></i></button>`:ready?`<button class="mslot big" data-a="repair" title="Consertar"><span class="mi">${gIcon(o)}</span><i class="mdur" style="width:100%;background:#4a4"></i></button>`:'<div class="mslot big empty"></div>';
  const msg=tab==='dis'?(!o?'Escolha o equipamento que será desmontado. Você recupera parte dos materiais.':`${o.n}: desmontar e recuperar ${Object.entries(dref).map(([k,n])=>n+'x '+IT[k].n).join(', ')} · 1h`):tab==='ench'&&!scr&&!AARW?'Escolha uma pedra de encantamento e a arma (ou as flechas) que será encantada.':(scr&&AARW)?`Encantar ${Math.min(10,G.inv.arrow||0)} flecha(s) com ${FXE[scr.fx]||''} ${FXL[scr.fx]} (até 10 por pedra) · 1h`:scr?(!o?'Escolha a arma que será encantada.':o.k!=='w'?'Pedras de encantamento encantam apenas armas.':`${o.n}: encantar com ${FXE[scr.fx]||''} ${FXL[scr.fx]} (substitui o efeito atual) · 1h`):!o?'Escolha o equipamento e o material (2) para consertar: ferro, couro, pano ou madeira, conforme a peça.':!need?`${o.n} não precisa de conserto.`:AMAT!==mk?`Falta colocar o material: ${IT[mk].n} (2).`:fe<2?`${IT[mk].n} insuficiente (2).`:`${o.n}: dur ${durP(o)} → 100% · 2 ${IT[mk].n} · 1h`;
  return `<section class="card mc"><h2>Bigorna</h2>${lvBox('anvil')}<p class="dim">Conserta, encanta e desmonta equipamentos.</p><div class="tabs sub"><button class="${tab==='repair'?'on':''}" data-a="antab" data-v="repair">🔨 Consertar</button><button class="${tab==='ench'?'on':''}" data-a="antab" data-v="ench" ${SL('anvil')<2?'disabled':''}>${SL('anvil')<2?'🔒':'✨'} Encantar</button><button class="${tab==='dis'?'on':''}" data-a="antab" data-v="dis" ${SL('anvil')<3?'disabled':''}>${SL('anvil')<3?'🔒':'♻️'} Desmontar</button></div>
  ${scr?`<canvas class="gemc" data-fx="${scr.fx}" width="120" height="120"></canvas>`:''}
  <div class="manv">${AARW?`<button class="mslot big sel" data-a="asel" data-v="i:arrow" title="Tirar"><span class="mi">${IT.arrow.i}</span><b class="mn">${Math.min(10,G.inv.arrow||0)}</b></button>`:o?`<button class="mslot big sel" data-a="asel" data-v="${AIT}" title="Tirar"><span class="mi">${gIcon(o)}</span>${durBar(o)}</button>`:slot('','')}${tab==='dis'?'':'<b>＋</b>'}${tab==='dis'?'':scr?`<button class="mslot big sel" data-a="asel" data-v="g:${scr.id}" title="Tirar"><span class="mi">${gIcon(scr)}</span></button>`:AMAT?`<button class="mslot big sel" data-a="asel" data-v="i:${AMAT}" title="Tirar"><span class="mi">${IT[AMAT].i}</span><b class="mn">2</b></button>`:slot('','')}<b>➜</b>${res}</div>
  <div class="mdet">${msg}</div>
  <h3 style="margin-top:8px">No inventário</h3><div class="mgrid">${cells.join('')}</div>
  <div class="btns">${tab==='dis'?`<button class="pri" data-a="dismantle" ${dref?'':'disabled'}>♻️ Desmontar</button>`:tab==='ench'?`<button class="pri" data-a="enchant" ${enOk?'':'disabled'}>✨ Encantar</button>`:`<button class="pri" data-a="repair" ${ready?'':'disabled'}>🔨 Consertar</button>`}<button data-a="close">Voltar</button></div></section>`;
};

A.openpurse=()=>{G.modal='purse'};
V.purse=()=>{const c=coinSplit(G.coins);return `<section class="card"><h2>Bolsa de dinheiro</h2><div class="row"><span class="l">${coinI('au')} Moedas de ouro</span><span class="r"><b>${c.au}</b></span></div><div class="row"><span class="l">${coinI('ag')} Moedas de prata</span><span class="r"><b>${c.ag}</b></span></div><div class="row"><span class="l">${coinI('cu')} Moedas de cobre</span><span class="r"><b>${c.cu}</b></span></div><div class="btns"><button data-a="close">Voltar</button></div></section>`};
const CATS={weapon:['sword','axe','cajado','knives','arrows'],armor:['gamb','mail','plate','cap1','cap2','pan0','pan1','pan2','bot0','bot1','bot2','hel0','hel1','shd0','shd1','mhat','mrobe','mtunic','mpants','mshoes'],misc:['sbag','skin','hpot','mpot','holy']};
A.ctab=v=>{G.ctab=v};A.atab=v=>{G.atab=v};A.wtab=v=>{G.wtab=v};
const WSUB={melee:['sword','axe'],ranged:['knives','arrows'],magic:['cajado']};
const ASUB={mage:['mhat','mrobe','mtunic','mpants','mshoes','cap2','pan0'],war:['gamb','mail','plate','pan2','bot1','bot2','hel1','shd1'],hunt:['cap1','pan1','bot0','hel0','shd0']};
A.sex=v=>{if(v==='m'||v==='f')G.gender=v};
const ownN=r=>{if(r.give){const k=Object.keys(r.give)[0];return have(k)}if(r.skin)return SK();if(r.gear){const nm=r.gear().n;const all=[...G.bag,...G.chest.bag,...['wep','arm','helm','cape','shield','pants','boots'].map(k=>G[k]).filter(Boolean)];return all.filter(o=>o.n===nm||(o.n.startsWith(nm)&&o.k==='w')).length}return null};
const recCard=r=>{const done=(r.build&&G.b[r.build])||(r.skin&&SK()>=3),lk=(RLV[r.id]||1)>SL('craft');const ok=!lk&&!done&&Object.entries(r.need).every(([k,n])=>have(k)>=n)&&(!r.forge||G.b.forge)&&(!r.stove||G.b.stove)&&(!r.repair||dmgd(r.repair).length);
  return `<div class="opt"><h4>${r.n}${ownN(r)==null?'':` <small class="own">possui ${ownN(r)}</small>`}</h4><p class="dim" style="margin:0 0 6px">${cost(r.need)}${r.forge?' · exige Ferraria':''}${r.stove?' · exige Forno':''}${lk?' · requer Mesa Nv '+RLV[r.id]:''}${r.h?' · '+r.h+'h':''}</p><button class="sm ${ok?'pri':''}" data-a="make" data-v="${r.id}" ${ok?'':'disabled'}>${done?(r.skin?'Máximo':'Construído'):'Fazer'}</button></div>`};
V.craft=()=>{const tab=G.ctab||'weapon',at=ASUB[G.atab]?G.atab:'mage',wt=G.wtab||'melee';let h=`<section class="card"><h2>Fabricação</h2>${lvBox('craft')}<div class="tabs"><button class="${tab==='weapon'?'on':''}" data-a="ctab" data-v="weapon">⚔️ Armas</button><button class="${tab==='armor'?'on':''}" data-a="ctab" data-v="armor">🛡️ Armaduras</button><button class="${tab==='misc'?'on':''}" data-a="ctab" data-v="misc">🧰 Outros</button></div><p class="dim">Usa itens do inventário e do depósito.</p>${tab==='weapon'?`<div class="tabs sub"><button class="${wt==='melee'?'on':''}" data-a="wtab" data-v="melee">⚔️ Corpo a corpo</button><button class="${wt==='ranged'?'on':''}" data-a="wtab" data-v="ranged">🏹 Distância</button><button class="${wt==='magic'?'on':''}" data-a="wtab" data-v="magic">🔮 Magia</button></div>`:''}${tab==='armor'?`<div class="tabs sub"><button class="${at==='mage'?'on':''}" data-a="atab" data-v="mage">🔮 Mago</button><button class="${at==='war'?'on':''}" data-a="atab" data-v="war">⚔️ Guerreiro</button><button class="${at==='hunt'?'on':''}" data-a="atab" data-v="hunt">🏹 Caçador</button></div>`:''}<div class="iscroll mscroll" data-sc="f"><div class="grid2">`;
  for(const r of RECIPES)if(CATS[tab].includes(r.id)&&(tab!=='armor'||ASUB[at].includes(r.id))&&(tab!=='weapon'||WSUB[wt].includes(r.id)))h+=recCard(r);
  return h+`</div></div><div class="btns"><button data-a="close">Voltar</button></div></section>`};
const _make=A.make;A.make=v=>{if(!G)return;const l0=G.log[0],n0=G.log.length;_make(v);if(G&&(G.log[0]!==l0||G.log.length!==n0))G.cmsg=G.log[0]};

V.well=()=>`<section class="card"><h2>Poço</h2><p class="dim">Enche ${DF().wr}% por dia. Água acumulada: <b>${Math.floor(G.wellW||0)}%</b> (cada 5% enche um gole do odre).</p><div class="prog"><i style="width:${Math.min(100,G.wellW||0)}%"></i></div>${G.cmsg?`<div class="bt" style="margin:8px 0">${G.cmsg}</div>`:''}<div class="btns" style="flex-direction:column;align-items:stretch"><button class="pri" data-a="wellfill">💧 Encher o odre</button><button data-a="close">Voltar</button></div></section>`;
V.stove=()=>{let h=`<section class="card"><h2>Forno de pedra</h2>${G.cmsg?`<div class="bt" style="margin:6px 0 10px">${G.cmsg}</div>`:''}<div class="grid2">`;

A.del=v=>{v=+v;if(DELARM===v){try{localStorage.removeItem('ashes-slot-'+v);cloudDel('ashes-slot-'+v)}catch(_){}DELARM=0}else DELARM=v};
function render(){
  if(G&&G.wolf&&G.wd==null&&typeof wolfHp==='function')wolfHp(true);
  if(G&&G.wolf&&typeof wolfBlock==='function'&&wolfBlock()){wolfHp(false);G.wolf=false;fx.morphRev=nowMs();lg('Em lugar seguro, você volta à forma humana.')}
  
  if(G&&G.mana!=null&&G.mana>MM())G.mana=MM();
  const hudo=$('#hudo'),bar_=$('#bar'),card=$('#card'),ov=$('#ov'),modal=$('#modal'),mapov=$('#mapov');
  if(!G){
    hudo.innerHTML='';bar_.hidden=true;ov.innerHTML='';mapov.hidden=true;
    card.hidden=false;card.className='start';
    card.innerHTML=`<div class="ct"><img class="dk-logo" alt="Darknoctis" src="${DKLOGO}"><p class="dim" style="margin-bottom:8px">O reino caiu. Você ainda não.</p>
    <div style="display:flex;gap:18px;justify-content:center;margin-bottom:6px"><label class="f"><input type="radio" name="gender" value="m" checked> Homem</label><label class="f"><input type="radio" name="gender" value="f"> Mulher</label></div>
    <div class="slots">${[1,2,3].map(slotRow).join('')}</div>
    </div><button class="langflag" data-a="lang" data-v="${LANG==='pt'?'en':'pt'}" aria-label="${LANG==='pt'?'Idioma: Português. Mudar para inglês':'Language: English. Switch to Portuguese'}" title="${LANG==='pt'?'Português':'English'}">${FLG[LANG]}</button>`;
    modal.hidden=true;return;

/* ===== animação de transição dos dias (morte): em qualquer cenário ===== */
function showDayAnim(d0,d1,vamp){
  const old=document.getElementById('dayfx');if(old)old.remove();
  const el=document.createElement('div');el.id='dayfx';el.className=vamp?'vp':'rs';
  el.innerHTML=`<div class="dfx-in"><div class="dfx-t">Você morreu</div><div class="dfx-clock"><i class="dfx-h1"></i><i class="dfx-h2"></i><b>${vamp?'🦇':'⌛'}</b></div><div class="dfx-n">Dia ${d0}</div><div class="dfx-s">${vamp?'O vampirismo no seu sangue preserva os dias':'O tempo recomeça'}</div></div>`;
  document.body.appendChild(el);
  const n=el.querySelector('.dfx-n');let done=false;
  const end=()=>{if(done)return;done=true;el.classList.add('out');setTimeout(()=>el.remove(),700)};
  el.addEventListener('click',end);
  const steps=Math.min(30,Math.abs(d1-d0)||1),dur=2400;let k=0;
  const iv=setInterval(()=>{k++;const v=vamp?(k>=steps?d1:d0):Math.max(d1,Math.round(d0-(d0-d1)*k/steps));n.textContent='Dia '+v;n.classList.remove('tick');void n.offsetWidth;n.classList.add('tick');if(k>=steps){clearInterval(iv);n.classList.add('fin');setTimeout(end,1500)}},dur/steps);
  setTimeout(end,6000);
}

    else if(f.k==='fang'){g.globalAlpha=al;g.fillStyle=f.c;const o=12*(1-Math.min(1,p*2.2));for(const sg of[-1,1]){g.beginPath();g.moveTo(x+sg*(2+o),y-9);g.lineTo(x+sg*(5+o),y-9);g.lineTo(x+sg*(3.5+o*.4),y+5);g.closePath();g.fill()}g.globalAlpha=1}

  {const hx=A.x-cx,hy=A.y-cy;

      g.globalAlpha=1;g.fillStyle='#ff8a30';g.beginPath();g.arc(ox,oy,5.5,0,6.3);g.fill();g.fillStyle='#ffe080';g.beginPath();g.arc(ox,oy,3,0,6.3);g.fill();g.fillStyle='#ff5a20';for(let k=0;k<3;k++){const a=an+Math.PI+(k-1)*.7+Math.sin(A.anim*20+k)*.2;g.beginPath();g.moveTo(ox,oy);g.lineTo(ox+Math.cos(a)*11,oy+Math.sin(a)*11);g.lineTo(ox+Math.cos(a+.45)*4,oy+Math.sin(a+.45)*4);g.closePath();g.fill()}}
